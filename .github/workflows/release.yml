# Publishes every release on GitHub's own runners, straight from the tagged
# source: the ZIP is `git archive` of the tag, nothing is built. The release
# notes carry the commit, a SHA-256 checksum, and (when a VirusTotal API key
# is configured as the VT_API_KEY secret) a scan link.
#
# To cut a release: write RELEASE_NOTES.md, then
#   git tag -a v1.2.3 -m v1.2.3 && git push origin v1.2.3
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Package release ZIP
        run: |
          tag="${{ github.ref_name }}"
          git archive --format=zip --prefix=GameSchedulerCompanion/ -o "GameSchedulerCompanion-$tag.zip" HEAD
          unzip -l "GameSchedulerCompanion-$tag.zip"
          # Batch files must ship with Windows line endings.
          unzip -p "GameSchedulerCompanion-$tag.zip" "GameSchedulerCompanion/Game Scheduler Companion.cmd" | grep -c $'\r' 
          sha256sum "GameSchedulerCompanion-$tag.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: VirusTotal scan
        id: vt
        if: env.VT_API_KEY != ''
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          files: GameSchedulerCompanion-${{ github.ref_name }}.zip

      - name: Write release notes
        run: |
          {
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; fi
            echo
            echo "## Verify this download"
            echo
            echo "Packaged by GitHub Actions from commit [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) - see the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}). The ZIP is the tagged source exactly as you can read it here: two batch files, one web page and an icon. Nothing in it is compiled."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            vt="${{ steps.vt.outputs.analysis }}"
            if [ -n "$vt" ]; then
              url="${vt#*=}"; url="${url%%,*}"
              echo
              echo "VirusTotal scan of the ZIP: $url"
            fi
          } > release-body.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" "GameSchedulerCompanion-$tag.zip" SHA256SUMS.txt --title "$tag" --notes-file release-body.md
